# The `minimal-v2` agent preset: 极简V2模式 — 动态极简双工具 + 完整目录渐进开放。
#
# 严格规则（主 Agent 与子 Agent 完全一致）：
#   1. 首轮只暴露 Minimal 双工具：平台 shell（POSIX 为 bash，Windows 为 pwsh，
#      与 minimal-v3 的既有平台约定一致）+ str_replace_editor。
#   2. 提示词固定为 "You are a helpful software engineer assistant."（complete
#      persona，runtime context 关闭，无任何其他提示词段落）。
#   3. 首次工具调用（持久 tool/call 事件）之后，本 preset 的完整目录开放。
#   4. 一次成功的压缩（compaction/end 无 error）后重新锚定：目录回到极简双工具，
#      直到下一次首次工具调用。锚定段由持久事件推导，resume/reload 无需内存状态。
#
# 门控由 `minimal-v2-bootstrap.mjs` 在 system-prompt/assemble 瀑布中执行；本文件
# 提供完整目录（standard 全量，去掉与 complete persona 冲突的 plan-mode）。
#
# 这是 AGENT-PLANE 组合。roster 以 standing scope 挂载一次，每个命名它的会话按
# scope 父子关系加入（含 spawn/fork 子 Agent），因此门控插件对主 Agent 与子 Agent
# 的每一轮装配都生效。发布服务的行必须放在带 `isolate` realm 的 group 里；其余行
# 只注册工具/提示词，解析宿主实例，松散放置。

# ── identity ────────────────────────────────────────────────────────────────

# 固定极简 persona：complete 提示词 + 关闭 runtime context 快照。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: You are a helpful software engineer assistant.
    complete: true
    includeRuntimeContext: false

# 首轮工具门控 + 压缩后重新锚定。只消费宿主 `systemPrompt`/`tools`，不发布任何
# 服务，无需 realm。装配瀑布在 agent scope 上派发，standing scope 的监听器经由
# scope 父链收到每个主/子 Agent 的装配。
- id: minimal-v2-bootstrap
  name: ./minimal-v2-bootstrap.mjs
  config: {}

# ── shell ───────────────────────────────────────────────────────────────────

# 双工具中的 shell：POSIX 为 bash，Windows 为 pwsh（Windows 无 bash，沿用
# minimal-v3 的平台约定）。executor（bash-sandbox/pwsh-sandbox）在宿主平面。
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# 双工具中的 str_replace_editor 由宿主行（dsh-base 的 tool-str-replace-editor）
# 提供，随完整目录开放。这里只放完整目录的其余文件工具。
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# 只放模型侧控制；任务 REGISTRY 留在宿主平面（跨会话共享、按 agent 键控）。
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# skill REGISTRY 在宿主、按 scope 分层；这两行注册进本 preset 的层。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# 只放模型侧工具；goal SERVICE/driver/命令留在宿主。
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── compaction ──────────────────────────────────────────────────────────────

# 压缩本体 + 手动 /compact + tool-result-pruner 共享 entry-local realm
# （compaction-basic 通过 ctx.get 读 toolResultPrune）。tokenMeter 留在宿主。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# subagents REGISTRY 与 spawn/fork 后端在宿主（进程单例）；本 preset 只贡献委托
# 工具。workflows 无外部消费者，故所有触达它的行共享一个 entry-local realm。
# tool-subagent-report 属宿主平面（continuable setup 列表非 scope-aware）。
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # 产品 provider 是宿主平面单例。按需复制本 preset 并去掉 disabled 即可
    # 只对使用该副本的 Agent 暴露对应产品工具。
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# `web` 服务与搜索 provider 在宿主；只有模型侧工具按会话挂载。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
